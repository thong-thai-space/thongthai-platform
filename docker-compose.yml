services:
  # ── Backend (NestJS) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: pnpm start:dev
    networks:
      - app-network

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
    networks:
      - app-network

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: thongthai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: thongthai
      POSTGRES_PASSWORD: thongthai123
      POSTGRES_DB: thongthai_space
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: thongthai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  # ── pgAdmin (optional, for DB management) ──
  pgadmin:
    image: dpage/pgadmin4
    container_name: thongthai-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thongthai.space
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    profiles:
      - tools
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
