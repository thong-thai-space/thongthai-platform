global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: thongthai-backend
    metrics_path: /api/health/live
    static_configs:
      - targets: ['backend:4000']

  - job_name: thongthai-backend-ready
    metrics_path: /api/health/ready
    static_configs:
      - targets: ['backend:4000']

  - job_name: thongthai-frontend-health
    metrics_path: /api/health
    static_configs:
      - targets: ['frontend:3000']
