services:
  nginx:
    image: nginx:1.27-alpine
    container_name: thongthai-nginx-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/templates/site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ./deploy/nginx/scripts/entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    container_name: thongthai-certbot-prod
    profiles: ['manual']
    volumes:
      - ./deploy/nginx/certbot/www:/var/www/certbot
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
