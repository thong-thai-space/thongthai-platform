name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to confirm production deployment
        required: true
        type: string
      deploy_ref:
        description: Branch or tag to deploy
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate confirmation text
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "Invalid confirmation text. You must type DEPLOY."
            exit 1
          fi

      - name: Validate ref is main
        run: |
          if [ "${{ github.event.inputs.deploy_ref }}" != "main" ]; then
            echo "Only main is allowed for production deploy."
            exit 1
          fi

      - name: Validate deploy actor when PROD_DEPLOYER is set
        env:
          PROD_DEPLOYER: ${{ vars.PROD_DEPLOYER }}
        run: |
          if [ -n "$PROD_DEPLOYER" ] && [ "$PROD_DEPLOYER" != "${{ github.actor }}" ]; then
            echo "Only $PROD_DEPLOYER can deploy production."
            exit 1
          fi

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: precheck
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f deploy/nginx/docker-compose.proxy.yml up -d
            docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d

            docker compose -f docker-compose.prod.yml ps

      - name: Backend health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            curl -fsS "https://${{ secrets.PROD_DOMAIN }}/api/health" >/dev/null

      - name: Frontend health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            curl -fsS "https://${{ secrets.PROD_DOMAIN }}/" >/dev/null